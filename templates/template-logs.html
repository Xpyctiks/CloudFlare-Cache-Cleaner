<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Логи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <style>
    body { padding-top: 75px; }
    pre { background: #111; color: #eee; padding: 1rem; border-radius: .375rem; overflow-x: auto; max-height: 75vh; }
  </style>
</head>
<body>
<main>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Cloudflare cache cleaner</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Головна</a></li>
        {% if is_admin %}
        <li class="nav-item"><a class="nav-link" href="/admin_panel/users/">Адмін панель</a></li>
        {% endif %}
        <li class="nav-item"><a class="nav-link active" href="/logs/">Логи</a></li>
      </ul>
      <div class="d-flex align-items-center">
        <form action="/logout/" method="POST" class="d-inline">
          <button class="btn btn-outline-warning" type="submit">🏃{{ current_user.realname }} Вихід</button>
        </form>
      </div>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card mb-3">
        <div class="card-header">Логи програми</div>
        <div class="card-body">
          {% if error_message %}
            <div class="alert alert-warning">{{ error_message }}</div>
          {% endif %}
          <div class="mb-3"><strong>Файл логів:</strong> {{ log_path or 'Не задано' }}</div>
          <pre>{{ log_lines or 'Жодних рядків для відображення.' }}</pre>
        </div>
      </div>
    </div>
  </div>
</div>
</main>
</body>
</html>
